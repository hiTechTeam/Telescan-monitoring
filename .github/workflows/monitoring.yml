name: Monitoring stack

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: bash -n ops/*.sh agent/ops/*.sh network/ops/*.sh egress/ops/*.sh grafana/*.sh

      - name: Test safety gates
        run: |
          bash ops/test-safety-gates.sh
          bash agent/ops/test-prune-docker-build-cache.sh

      - name: Test frozen attestation inventory
        run: bash ops/test-attestation-inventory.sh

      - name: Test transactional monitoring rollback
        run: bash ops/test-monitoring-transaction.sh

      - name: Validate YAML
        run: |
          ruby -e '
            require "date"
            require "yaml"
            Dir.glob("**/*.{yaml,yml}", File::FNM_DOTMATCH).each do |path|
              next if path.start_with?(".git/")
              YAML.safe_load(File.read(path), permitted_classes: [Date], aliases: true)
              puts "valid YAML: #{path}"
            end
          '

      - name: Validate dashboard JSON
        run: |
          for dashboard in config/grafana/dashboards/*.json; do
            python3 -m json.tool "$dashboard" >/dev/null
          done

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.grafana-secret-key.yaml config --quiet
          COMPOSE_PROFILES=restricted-ingest docker compose config --quiet
          TELESCAN_HOST=ci docker compose -f agent/compose.yaml config --quiet

      - name: Test Prometheus rules
        run: bash ops/test-promql.sh --pull

      - name: Test restricted ingest configuration
        run: bash ops/test-ingest-config.sh --pull

      - name: Validate Alloy configurations
        run: bash ops/test-alloy-config.sh --pull

      - name: Reject local artifacts
        run: |
          if find . -type f \( -name '.env' -o -name '._*' -o -name '.DS_Store' \) -print -quit | grep -q .; then
            echo 'Local artifact or secret file found in repository.' >&2
            exit 1
          fi

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          MONITORING_KNOWN_HOSTS: ${{ secrets.MONITORING_KNOWN_HOSTS }}
          MONITORING_SSH_KEY: ${{ secrets.MONITORING_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/monitoring_deploy
          printf '%s\n' "$MONITORING_SSH_KEY" > ~/.ssh/monitoring_deploy
          printf '%s\n' "$MONITORING_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload, deploy, and verify under the production lock
        env:
          MONITORING_HOST: ${{ vars.MONITORING_HOST }}
          MONITORING_USER: ${{ vars.MONITORING_USER }}
        run: |
          set -Eeuo pipefail
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='data' \
            --create --gzip --file=- . | \
            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/monitoring_deploy \
              "$MONITORING_USER@$MONITORING_HOST" '
                set -Eeuo pipefail
                command -v flock >/dev/null
                exec 9>/tmp/telescan-production-deploy.lock
                flock --exclusive --timeout 1800 9
                release_root="$(mktemp -d /home/ubuntu/.telescan-monitoring-release.XXXXXX)"
                trap '\''rm -r -- "$release_root"'\'' EXIT
                tar --extract --gzip --file=- --directory "$release_root"
                chmod +x "$release_root"/ops/*.sh
                cmp --silent \
                  "$release_root/systemd/telescan-monitoring-release-recovery.service" \
                  /etc/systemd/system/telescan-monitoring-release-recovery.service
                cmp --silent \
                  "$release_root/systemd/telescan-monitoring-release-recovery.path" \
                  /etc/systemd/system/telescan-monitoring-release-recovery.path
                sudo systemctl is-enabled --quiet telescan-monitoring-release-recovery.service
                sudo systemctl is-enabled --quiet telescan-monitoring-release-recovery.path
                sudo systemctl is-active --quiet telescan-monitoring-release-recovery.path
                "$release_root/ops/run-release-transaction.sh" \
                  --apply \
                  --confirm DEPLOY_MONITORING_RELEASE_WITH_ROLLBACK \
                  --active-root /home/ubuntu/telescan-monitoring \
                  --release-root "$release_root"
              '
