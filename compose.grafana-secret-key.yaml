services:
  grafana:
    environment:
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
    volumes:
      - ${MONITORING_DATA_ROOT:-/var/lib/telescan-monitoring}/secrets/grafana_secret_key:/run/secrets/grafana_secret_key:ro
      - ${MONITORING_DATA_ROOT:-/var/lib/telescan-monitoring}/secrets/grafana_secret_key_ready:/run/secrets/grafana_secret_key_ready:ro
      - ./grafana/secret-key-entrypoint.sh:/usr/local/bin/telescan-grafana-secret-key-entrypoint:ro
    entrypoint:
      - /usr/local/bin/telescan-grafana-secret-key-entrypoint
