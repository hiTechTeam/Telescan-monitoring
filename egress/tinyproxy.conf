User tinyproxy
Group tinyproxy

Port 8888
Listen 10.78.0.3
Timeout 30

Syslog On
LogLevel Notice
PidFile "/run/tinyproxy/tinyproxy.pid"

MaxClients 16

Allow 10.78.0.1

ConnectPort 443

Filter "/etc/tinyproxy/telescan-telegram-filter"
FilterType ere
FilterCaseSensitive No
FilterDefaultDeny Yes

ViaProxyName "telescan-egress"
DisableViaHeader Yes
