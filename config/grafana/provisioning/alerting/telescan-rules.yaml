apiVersion: 1

policies:
  - orgId: 1
    receiver: empty
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: telegram-telescan
        object_matchers:
          - [service, =, telescan]
        group_by: [alertname, host, check, drill_id]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h

groups:
  - orgId: 1
    name: public-endpoints
    folder: Telescan
    interval: 30s
    rules:
      - uid: telescan-public-endpoints
        title: Public endpoint unavailable
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 1 - probe_success{job=~"integrations/blackbox/(api-ready|eu-relay|privacy-page|terms-page)"}
              instant: true
              intervalMs: 1000
              legendFormat: "{{job}}"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          description: A public Telescan health endpoint is unavailable or stopped reporting.
          summary: Public endpoint unavailable
        labels:
          severity: critical
          service: telescan
        isPaused: false

  - orgId: 1
    name: production-infrastructure
    folder: Telescan
    interval: 30s
    rules:
      - uid: telescan-production-health
        title: Production infrastructure requires attention
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: telescan:production_problem
              instant: true
              intervalMs: 1000
              legendFormat: "{{check}} {{host}} {{container}} {{unit}} {{interface}}"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          description: A production host, container, timer, backup, WireGuard tunnel, collector, storage, Loki growth, or capacity check exceeded its safe threshold.
          summary: Production infrastructure requires attention
        labels:
          severity: critical
          service: telescan
        isPaused: false

  - orgId: 1
    name: notification-delivery-drill
    folder: Telescan
    interval: 10s
    rules:
      - uid: telescan-notification-delivery-drill
        title: Telescan notification delivery drill
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: telescan_telegram_delivery_drill == 1
              instant: true
              intervalMs: 1000
              legendFormat: "{{drill_id}}"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          description: "Operator drill {{ $labels.drill_id }} is exercising Grafana, the notification policy, the restricted EU proxy, and Telegram delivery."
          summary: "Telescan notification delivery drill {{ $labels.drill_id }}"
        labels:
          drill: "true"
          service: telescan
          severity: info
        isPaused: false
